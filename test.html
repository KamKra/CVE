
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wykryte Podatności</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; line-height: 1.6; background-color: #f4f7f6; color: #333; margin: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px 15px; border: 1px solid #ddd; text-align: left; vertical-align: top; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
        h1 { color: #0056b3; }
        td:nth-child(5) { max-width: 400px; word-wrap: break-word; } /* Ogranicza szerokość opisu */
        td { word-break: break-all; } /* Łamie długie słowa, np. w wektorach CVSS */
    </style>
</head>
<body>
    <h1>Wykryte podatności (Exploited)</h1>
<table><thead><tr><th>id</th><th>aliases</th><th>product_name</th><th>vendor_name</th><th>description</th><th>datePublished</th><th>dateUpdated</th><th>exploitedSince</th><th>baseScore</th><th>baseScoreVector</th><th>epss</th></tr></thead><tbody><tr><td colspan="11">Brak wyników.</td></tr></tbody></table>
</body>
</html>
